        arch: amd64
    uri: https://github.com/vivektech/kubectl-harvest/releases/download/v1.0.2/kubectl-harvest_1.0.2_windows_amd64.zip
    sha256: 55862adab24f433bf29d097b29ab8a972888a9093653ef793ad846949cf58029
    bin: kubectl-harvest.exe
  - selector:
      matchLabels:
        os: windows
        arch: arm64
