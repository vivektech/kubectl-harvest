apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: harvest
spec:
  version: v1.0.2
  homepage: https://github.com/vivektech/kubectl-harvest
  shortDescription: Delete unused Kubernetes resources.
  description: |
    kubectl-harvest is a kubectl plugin that deletes unused Kubernetes resources.

    Supported resources:
    - Pods (whose status is not Running)
    - ReplicaSets (scaled down to 0 replicas; the live revision and the newest revisions of each Deployment are always kept for rollback, configurable via --keep-revisions, default 5)
    - ConfigMaps (not referenced by any Pods or workload Pod templates)
    - Secrets (not referenced by any Pods, workload Pod templates, ServiceAccounts, Ingress TLS, or ExternalSecrets)
    - PersistentVolumes (not satisfying any PersistentVolumeClaims)
    - PersistentVolumeClaims (not referenced by any Pods or workload Pod templates)
    - Jobs (completed)
    - PodDisruptionBudgets (not targeting any Pods)
    - HorizontalPodAutoscalers (not targeting any resources)
    - NetworkPolicies (not selecting any Pods)

    Built against Kubernetes 1.36 client libraries; works with clusters 1.21+.
    Successor of the archived micnncim/kubectl-reap.
  caveats: |
    This plugin deletes resources. Always run with --dry-run=client or
    --interactive first to review what would be deleted, especially in
    production. Resources in kube-system are never touched.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/vivektech/kubectl-harvest/releases/download/v1.0.2/kubectl-harvest_1.0.2_darwin_amd64.tar.gz
    sha256: 3bb6f082843ca7d868223cbbcb0e3aff63bbd0a265eb4432c23fc4ecf735f753
    bin: kubectl-harvest
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/vivektech/kubectl-harvest/releases/download/v1.0.2/kubectl-harvest_1.0.2_darwin_arm64.tar.gz
    sha256: b94f86ae9cc43e308de959f68b657a72d26c25beb29321f0102070a720a10b2a
    bin: kubectl-harvest
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/vivektech/kubectl-harvest/releases/download/v1.0.2/kubectl-harvest_1.0.2_linux_amd64.tar.gz
    sha256: 2985193c103aee81251420d84f4a13928393227481f4630b14613f43c63b6552
    bin: kubectl-harvest
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/vivektech/kubectl-harvest/releases/download/v1.0.2/kubectl-harvest_1.0.2_linux_arm64.tar.gz
    sha256: 42f7e8d4e7ed5e852bd252e0832da1f63af985062801e13eb62b50a5bca87b72
    bin: kubectl-harvest
  - selector:
      matchLabels:
