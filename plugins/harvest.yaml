apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: harvest
spec:
  version: v1.0.1
  homepage: https://github.com/vivektech/kubectl-harvest
  shortDescription: Delete unused Kubernetes resources.
  description: |
    kubectl-harvest is a kubectl plugin that deletes unused Kubernetes resources.

    Supported resources:
    - Pods (whose status is not Running)
    - ReplicaSets (scaled down to 0 replicas; the live revision and the newest revisions of each Deployment are always kept for rollback, configurable via --keep-revisions, default 5)
    - ConfigMaps (not referenced by any Pods or workload Pod templates)
    - Secrets (not referenced by any Pods, workload Pod templates, ServiceAccounts, Ingress TLS, or ExternalSecrets)
    - PersistentVolumes (not satisfying any PersistentVolumeClaims)
    - PersistentVolumeClaims (not referenced by any Pods or workload Pod templates)
    - Jobs (completed)
    - PodDisruptionBudgets (not targeting any Pods)
    - HorizontalPodAutoscalers (not targeting any resources)
    - NetworkPolicies (not selecting any Pods)

    Built against Kubernetes 1.36 client libraries; works with clusters 1.21+.
    Successor of the archived micnncim/kubectl-reap.
  caveats: |
    This plugin deletes resources. Always run with --dry-run=client or
    --interactive first to review what would be deleted, especially in
    production. Resources in kube-system are never touched.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/vivektech/kubectl-harvest/releases/download/v1.0.1/kubectl-harvest_1.0.1_darwin_amd64.tar.gz
    sha256: 9ac236a088feea4ff38bd1d133a2daf48b4d2a7a97980e5fc2cd0ef39abaeaf4
    bin: kubectl-harvest
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/vivektech/kubectl-harvest/releases/download/v1.0.1/kubectl-harvest_1.0.1_darwin_arm64.tar.gz
    sha256: 59e3d1bc9916c6fda5407d04fb60533a76bb237df41149152c4bf1d4bd653efd
    bin: kubectl-harvest
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/vivektech/kubectl-harvest/releases/download/v1.0.1/kubectl-harvest_1.0.1_linux_amd64.tar.gz
    sha256: 9fdbb4e99cfa178f433081ea698c2faef42c6b5fc733a6016bebb6d2b98509b5
    bin: kubectl-harvest
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/vivektech/kubectl-harvest/releases/download/v1.0.1/kubectl-harvest_1.0.1_linux_arm64.tar.gz
    sha256: 85502c1373e6581f1312b40e4d403fc80f97ac1c834367991922c8f020d0a49a
    bin: kubectl-harvest
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/vivektech/kubectl-harvest/releases/download/v1.0.1/kubectl-harvest_1.0.1_windows_amd64.zip
    sha256: f36fbc908bb6e62dfb13ab1f05ec5ae1baffe5975f481e1d8d1ae87df3e886a4
    bin: kubectl-harvest.exe
  - selector:
      matchLabels:
        os: windows
        arch: arm64
    uri: https://github.com/vivektech/kubectl-harvest/releases/download/v1.0.1/kubectl-harvest_1.0.1_windows_arm64.zip
    sha256: a9aa5560fede544f9824fdbb7907ca37927dd1c879ccce64d1f8547f977731f4
    bin: kubectl-harvest.exe
