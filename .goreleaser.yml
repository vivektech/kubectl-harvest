version: 2

project_name: kubectl-harvest

builds:
  - main: ./cmd/kubectl-harvest
    binary: kubectl-harvest
    ldflags:
      - -s -w
      - -X github.com/vivektech/kubectl-harvest/pkg/version.Version={{.Tag}}
      - -X github.com/vivektech/kubectl-harvest/pkg/version.Revision={{.ShortCommit}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch

brews:
  - repository:
      owner: vivektech
      name: kubectl-harvest
    directory: Formula
    homepage: https://github.com/vivektech/kubectl-harvest
    description: kubectl plugin that deletes unused Kubernetes resources
    license: Apache-2.0
